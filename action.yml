name: 'analytica.click.gh'
description: 'analytica.click GH build step'
author: 'analytica.click'
inputs:
  ANALYTICA_TOKEN:
    required: true
    description: 'your site admin API key'
  DEPLOY_NAME:
    required: false
    description: 'set only on the job that deploys: what it puts live, such as web or api'
  DEPLOY_VERSION:
    required: false
    description: 'optional version of the deploy; the date and time (UTC) without one'
  GITHUB_CONTEXT:
    required: false
    description: 'the github context'
    default: '${{ toJson(github) }}'
  JOB_CONTEXT:
    required: false
    description: 'the job context'
    default: '${{ toJson(job) }}'
  GITHUB_TOKEN:
    required: false
    description: 'automatic github token used to read failure annotations. no secret needed, defaults to github.token'
    default: '${{ github.token }}'
runs:
  using: 'node16'
  pre: 'dist/pre.js'
  main: 'dist/index.js'
