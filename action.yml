name: 'analytica.click.gh'
description: 'analytica.click GH build step'
author: 'analytica.click'
inputs:
  ANALYTICA_TOKEN:
    required: true
    description: 'your API token'
  GITHUB_CONTEXT:
    required: false
    description: 'the github context'
    default: '${{ toJson(github) }}'
  JOB_CONTEXT:
    required: false
    description: 'the job context'
    default: '${{ toJson(job) }}'
  GITHUB_TOKEN:
    required: false
    description: 'automatic github token used to read failure annotations. no secret needed, defaults to github.token'
    default: '${{ github.token }}'
runs:
  using: 'node16'
  main: 'dist/index.js'
